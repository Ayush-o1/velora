databases:
  - name: velora-db
    plan: free
    region: oregon

services:
  - name: velora-backend
    type: web
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health/
    envVars:
      # Auto-generated by Render — never set by hand.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      # Fixed production values. Local dev keeps its own separate values in .env.
      - key: DEBUG
        value: "False"
      - key: ENABLE_HTTPS
        value: "True"
      - key: REFRESH_COOKIE_SECURE
        value: "True"
      # Cross-site cookie: Vercel and Render are different origins, unlike the
      # same-origin Nginx setup used locally, so Lax (the local default) would
      # not be sent back on API calls from the frontend's domain.
      - key: REFRESH_COOKIE_SAMESITE
        value: "None"

      # These depend on the exact hostnames Render/Vercel assign on first
      # deploy, so they're filled in once — not guessed — after that deploy.
      # See README "Live demo" / DECISIONS.md for the values actually used.
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_REDIRECT_URI
        sync: false

      # Wired to the free Postgres instance below — matches the
      # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_HOST /
      # POSTGRES_PORT names velora/settings.py already reads.
      - key: POSTGRES_DB
        fromDatabase:
          name: velora-db
          property: database
      - key: POSTGRES_USER
        fromDatabase:
          name: velora-db
          property: user
      - key: POSTGRES_PASSWORD
        fromDatabase:
          name: velora-db
          property: password
      - key: POSTGRES_HOST
        fromDatabase:
          name: velora-db
          property: host
      - key: POSTGRES_PORT
        fromDatabase:
          name: velora-db
          property: port
