worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 5m;

    # Only echo `Connection: upgrade` for requests that actually asked to
    # upgrade. Sending it unconditionally puts a bogus hop-by-hop header on
    # every ordinary page request; this map makes it "upgrade" for
    # WebSocket handshakes (Next.js dev HMR) and "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend_upstream {
        server backend:8000;
    }

    upstream frontend_upstream {
        server frontend:3000;
    }

    server {
        listen 80;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Django API, admin, and its collected static assets stay on the backend.
        location ~ ^/(api|admin|static)/ {
            proxy_pass http://backend_upstream;
        }

        # Everything else (pages, _next assets) goes to the Next.js server.
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
