worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 5m;

    # Only echo `Connection: upgrade` for requests that actually asked to
    # upgrade. Sending it unconditionally puts a bogus hop-by-hop header on
    # every ordinary page request; this map makes it "upgrade" for
    # WebSocket handshakes (Next.js dev HMR) and "close" otherwise.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker's embedded DNS. An `upstream` block resolves its host once,
    # at startup, and caches the IP forever — so rebuilding just the
    # frontend (which gets a new container IP) left Nginx serving 502s at
    # a container that no longer existed until it was restarted too.
    # Naming the target through a variable forces a re-resolve, with this
    # resolver and a short TTL doing the lookup.
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 80;
        server_tokens off;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Django API, admin, and its collected static assets stay on the backend.
        location ~ ^/(api|admin|static)/ {
            set $backend_target backend:8000;
            # $request_uri must be appended explicitly: a proxy_pass whose
            # target contains a variable no longer forwards the URI itself.
            proxy_pass http://$backend_target$request_uri;
        }

        # Everything else (pages, _next assets) goes to the Next.js server.
        location / {
            set $frontend_target frontend:3000;
            proxy_pass http://$frontend_target$request_uri;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }
    }
}
